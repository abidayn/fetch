# Build APK release lalu terbitkan ke GitHub Releases, supaya beta tester bisa
# unduh langsung dari:
#   https://github.com/abidayn/fetch/releases/latest/download/app-release.apk
#
# Jalan saat tag versi di-push (git tag v0.6.0 && git push origin v0.6.0),
# atau manual dari tab Actions (hasilnya cuma jadi artifact, bukan Release).
#
# Butuh di Settings -> Secrets and variables -> Actions:
#   secrets  : ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   variables: API_BASE_URL (URL backend production, tanpa "/" di akhir)
name: Android release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # membuat Release + upload APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Cek secret & variable lengkap
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        # Tanpa cek ini, keystore kosong membuat Gradle diam-diam jatuh ke
        # debug key -- APK tetap jadi, tapi tidak bisa menimpa versi lama di HP.
        run: |
          for v in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD API_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v belum diisi di repo settings"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6' # samakan dengan versi di laptop
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Pasang keystore release
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      # --build-number naik tiap run: Android menolak APK dengan versionCode
      # yang tidak lebih besar dari versi terpasang.
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Terbitkan Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
