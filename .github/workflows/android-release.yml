# Build a release APK and publish it to GitHub Releases, so beta testers can
# download it directly from:
#   https://github.com/abidayn/fetch/releases/latest/download/app-release.apk
#
# Runs when a version tag is pushed (git tag v0.7.1 && git push origin v0.7.1),
# or manually from the Actions tab (then it's only an artifact, not a Release).
#
# Needs, under Settings -> Secrets and variables -> Actions:
#   secrets  : ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   variables: API_BASE_URL (production backend URL, no trailing "/")
# Full walkthrough: docs/operations.md, "Releasing the Android app".
name: Android release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the Release + upload the APK

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets & variables are set
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        # Without this check, an empty keystore makes Gradle silently fall back
        # to the debug key -- the APK still builds, but can't update the old one on phones.
        run: |
          for v in KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD API_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the repo settings"; exit 1; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6' # keep in sync with the local Flutter version
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install the release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      # --build-number goes up every run: Android rejects an APK whose
      # versionCode isn't higher than the installed version's.
      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --build-number=${{ github.run_number }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Save the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
